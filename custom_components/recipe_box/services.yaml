import_recipe:
  fields:
    url:
      required: true
      example: https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
      selector:
        text:
          type: url

remove_recipe:
  fields:
    url:
      example: https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
      selector:
        text:
          type: url
    entity_id:
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor

add_to_shopping_list:
  fields:
    entity_id:
      required: true
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor
