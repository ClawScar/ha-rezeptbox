import_recipe:
  fields:
    url:
      example: https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
      selector:
        text:
          type: url
    urls:
      example:
        - https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
        - https://www.chefkoch.de/rezepte/1065461220711547/Lasagne.html
      selector:
        text:
          type: url
          multiple: true

add_recipe:
  fields:
    title:
      required: true
      example: Omas Apfelkuchen
      selector:
        text:
    ingredients:
      required: true
      example:
        - 4 Äpfel
        - 200 g Mehl
      selector:
        text:
          multiple: true
    instructions:
      example:
        - Äpfel schälen und schneiden.
        - Teig ausrollen und 45 Minuten backen.
      selector:
        text:
          multiple: true
    servings:
      example: 8
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    tags:
      example:
        - Kuchen
        - Familie
      selector:
        text:
          multiple: true
    image_url:
      example: https://example.com/kuchen.jpg
      selector:
        text:
          type: url
    url:
      example: https://example.com/omas-apfelkuchen
      selector:
        text:
          type: url

set_recipe_image:
  fields:
    image_url:
      example: /api/image/serve/0123456789abcdef0123456789abcdef/original
      selector:
        text:
    url:
      example: manual://omas-apfelkuchen-1a2b3c4d
      selector:
        text:
    entity_id:
      example: sensor.omas_apfelkuchen
      selector:
        entity:
          integration: recipe_box
          domain: sensor

cleanup_recipe_images:
  fields: {}

remove_recipe:
  fields:
    url:
      example: https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
      selector:
        text:
          type: url
    entity_id:
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor

refresh_recipe:
  fields:
    url:
      example: https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
      selector:
        text:
          type: url
    entity_id:
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor

add_to_shopping_list:
  fields:
    entity_id:
      required: true
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor
          multiple: true
    servings:
      example: 6
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    exclude:
      example:
        - 2 Zwiebeln
      selector:
        text:
          multiple: true
    merge:
      default: true
      selector:
        boolean:

export_recipes:
  fields: {}

import_recipes:
  fields:
    recipes:
      required: true
      example:
        - title: Omas Apfelkuchen
          source_url: https://example.com/omas-apfelkuchen
          ingredients:
            - 4 Äpfel
      selector:
        object:
    plan:
      example:
        "2026-11-25":
          url: https://example.com/omas-apfelkuchen
          servings: 8
      selector:
        object:
    favorites:
      example:
        - https://example.com/omas-apfelkuchen
      selector:
        text:
          multiple: true

plan_recipe:
  fields:
    date:
      required: true
      example: "2026-11-25"
      selector:
        date:
    entity_id:
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor
    url:
      example: https://example.com/omas-apfelkuchen
      selector:
        text:
          type: url
    label:
      example: Reste
      selector:
        text:
    servings:
      example: 4
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box

clear_meal_plan:
  fields:
    date:
      example: "2026-11-25"
      selector:
        date:

set_favorite:
  fields:
    entity_id:
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor
    url:
      example: https://example.com/omas-apfelkuchen
      selector:
        text:
          type: url
    favorite:
      example: true
      selector:
        boolean:

set_groups:
  fields:
    groups:
      required: true
      example:
        - Familie
        - Backen
      selector:
        text:
          multiple: true
    entity_id:
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor
    url:
      example: https://example.com/omas-apfelkuchen
      selector:
        text:
          type: url

add_group:
  fields:
    group:
      required: true
      example: Familie
      selector:
        text:

remove_group:
  fields:
    group:
      required: true
      example: Familie
      selector:
        text:

rename_group:
  fields:
    group:
      required: true
      example: Familie
      selector:
        text:
    name:
      required: true
      example: Familie & Gäste
      selector:
        text:

move_group:
  fields:
    group:
      required: true
      example: Familie
      selector:
        text:
    direction:
      required: true
      example: up
      selector:
        select:
          options:
            - up
            - down
