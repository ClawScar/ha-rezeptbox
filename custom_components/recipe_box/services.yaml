import_recipe:
  fields:
    url:
      example: https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
      selector:
        text:
          type: url
    urls:
      example:
        - https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
        - https://www.chefkoch.de/rezepte/1065461220711547/Lasagne.html
      selector:
        text:
          type: url
          multiple: true

remove_recipe:
  fields:
    url:
      example: https://www.chefkoch.de/rezepte/2060241333351072/Die-beste-Okroschka-nach-Mamas-Rezept.html
      selector:
        text:
          type: url
    entity_id:
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor

add_to_shopping_list:
  fields:
    entity_id:
      required: true
      example: sensor.lasagne
      selector:
        entity:
          integration: recipe_box
          domain: sensor
    servings:
      example: 6
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
